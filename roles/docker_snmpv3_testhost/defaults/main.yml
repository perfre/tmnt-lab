---
docker_snmpv3_testhost:  # noqa: var-naming[no-role-prefix]
  project_name: snmpv3-testhosts
  project_dir: /opt/docker/snmpv3-testhosts
  docker_binary: /usr/bin/docker
  apply: true
  pull_policy: always
  build: always
  recreate: auto
  remove_orphans: true
  wait: false
  wait_timeout: null
  restart: unless-stopped

  image_name: tmnt/snmpv3-testhost
  base_image: alpine:3.20
  listen_port: 161
  syslocation: tmnt-lab
  syscontact: noc@example.invalid

  default_user:
    name: poller
    auth_protocol: SHA
    auth_password: authpass123
    privacy_protocol: AES
    privacy_password: privpass123
    security_level: authPriv

  network:
    name: snmpv3_testhosts
    external: false

  containers:
    snmpv3-linux01:
      hostname: snmpv3-linux01
      host_port: 1161
      sysdescr: Linux SNMPv3 test host
      sysobjectid: 1.3.6.1.4.1.8072.3.2.10
      user: {}
      scalars:
        - oid: 1.3.6.1.2.1.25.1.6.0
          type: integer
          value: "42"
        - oid: 1.3.6.1.4.1.8072.9999.1.0
          type: string
          value: tmnt mock data
