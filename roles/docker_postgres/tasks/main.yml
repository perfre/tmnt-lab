---
- name: Validate docker_postgres configuration
  ansible.builtin.assert:
    that:
      - docker_postgres is mapping
      - docker_postgres.project_name is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]+$')
      - docker_postgres.project_dir is match('^/\\S+$')
      - docker_postgres.data_dir is match('^/\\S+$')
      - docker_postgres.bind_address in ['127.0.0.1', '::1']
      - docker_postgres.listen_port | int >= 1024
      - docker_postgres.listen_port | int <= 65535
      - docker_postgres.image is not search(':latest$')
      - docker_postgres.admin_password | length >= 16
      - docker_postgres.admin_password not in ['password', 'changeme', 'CHANGE_ME', 'admin']
      - docker_postgres.network.name | length > 0
      - docker_postgres.network.alias | length > 0
      - docker_postgres.admin_network.name | length > 0
      - docker_postgres.admin_network.alias | length > 0
      - docker_postgres.admin_network.name != docker_postgres.network.name
      - docker_postgres.admin_user is match('^[A-Za-z0-9_]+$')
    fail_msg: >-
      docker_postgres requires explicit inventory settings, a pinned image, an
      administrator secret, internal application/admin networks, and a loopback
      administrative listener until PostgreSQL TLS is added to the runtime role.
  no_log: true

- name: Ensure PostgreSQL project and data directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ docker_postgres.project_dir }}"
      owner: root
      group: root
      mode: "0750"
    - path: "{{ docker_postgres.data_dir }}"
      owner: "999"
      group: "999"
      mode: "0700"

- name: Render PostgreSQL administrator secret
  ansible.builtin.copy:
    content: "{{ docker_postgres.admin_password }}\n"
    dest: "{{ docker_postgres.project_dir }}/postgres-password"
    owner: root
    group: "999"
    mode: "0640"
  no_log: true
  diff: false
  notify: Restart docker postgres compose

- name: Render PostgreSQL Docker Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ docker_postgres.project_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker postgres compose

- name: Install PostgreSQL Compose systemd unit
  ansible.builtin.template:
    src: docker-postgres.service.j2
    dest: /etc/systemd/system/docker-postgres.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker postgres compose

- name: Enable PostgreSQL Compose systemd unit
  ansible.builtin.systemd:
    name: docker-postgres
    enabled: true
    daemon_reload: true

- name: Start or update PostgreSQL Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ docker_postgres.project_dir }}"
    project_name: "{{ docker_postgres.project_name }}"
    files:
      - compose.yml
    docker_cli: "{{ docker_postgres.docker_binary }}"
    state: present
    pull: "{{ docker_postgres.pull_policy }}"
    recreate: "{{ docker_postgres.recreate }}"
    remove_orphans: "{{ docker_postgres.remove_orphans | bool }}"
    wait: "{{ docker_postgres.wait | bool }}"
    wait_timeout: "{{ docker_postgres.wait_timeout }}"
  when: docker_postgres.apply | bool
