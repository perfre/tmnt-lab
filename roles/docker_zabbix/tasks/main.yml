---
- name: Validate docker_zabbix configuration
  ansible.builtin.assert:
    that:
      - docker_zabbix is mapping
      - docker_zabbix.project_dir | length > 0
      - docker_zabbix.version_tag is match('^.+-7\\.4(-latest|\\.[0-9]+)?$')
      - docker_zabbix.database.host | length > 0
      - docker_zabbix.database.port | int > 0
      - docker_zabbix.database.port | int <= 65535
      - docker_zabbix.database.password | length > 0
      - docker_zabbix.database.network.external | bool
      - docker_zabbix.database.network.name | length > 0
      - docker_zabbix.ldap.enabled is boolean
      - not docker_zabbix.ldap.enabled | bool or not docker_zabbix.ldap.validate_certs | bool or docker_zabbix.ldap.ca_path | length > 0
      - not docker_zabbix.ldap.enabled | bool or not docker_zabbix.ldap.validate_certs | bool or docker_zabbix.ldap.ca_container_path is match('^/\\S+$')
      - not docker_zabbix.ldap.enabled | bool or docker_zabbix.ldap.network.external | bool
      - not docker_zabbix.ldap.enabled | bool or docker_zabbix.ldap.network.name | length > 0
    fail_msg: >-
      docker_zabbix requires a Zabbix 7.4 image tag, complete external
      PostgreSQL connection, and when LDAP is enabled a CA path and external
      LDAP network.

- name: Ensure Zabbix project directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ docker_zabbix.project_dir }}"
    - "{{ docker_zabbix.server.data_dir }}"

- name: Ensure configured Zabbix bind mount sources exist
  ansible.builtin.file:
    path: "{{ item.source }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ docker_zabbix.plugin_mounts + docker_zabbix.agent.plugin_mounts + docker_zabbix.web.volumes }}"
  when:
    - docker_zabbix.create_mount_sources | bool
    - item.source is defined

- name: Render Zabbix Docker Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ docker_zabbix.project_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart docker zabbix compose

- name: Install Zabbix Compose systemd unit
  ansible.builtin.template:
    src: docker-zabbix.service.j2
    dest: /etc/systemd/system/docker-zabbix.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker zabbix compose

- name: Enable Zabbix Compose systemd unit
  ansible.builtin.systemd:
    name: docker-zabbix
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode

- name: Start or update Zabbix Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ docker_zabbix.project_dir }}"
    project_name: "{{ docker_zabbix.project_name }}"
    files:
      - compose.yml
    docker_cli: "{{ docker_zabbix.docker_binary }}"
    state: present
    pull: "{{ docker_zabbix.pull_policy }}"
    recreate: "{{ docker_zabbix.recreate }}"
    remove_orphans: "{{ docker_zabbix.remove_orphans | bool }}"
    wait: "{{ docker_zabbix.wait | bool }}"
    wait_timeout: "{{ docker_zabbix.wait_timeout | default(omit, true) }}"
  when:
    - docker_zabbix.apply | bool
    - not ansible_check_mode
