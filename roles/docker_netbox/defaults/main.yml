---
docker_netbox:  # noqa: var-naming[no-role-prefix]
  project_name: netbox
  project_dir: /opt/docker/netbox
  docker_binary: /usr/bin/docker
  apply: true
  pull_policy: always
  recreate: auto
  remove_orphans: true
  wait: false
  wait_timeout: null
  restart: unless-stopped

  image: docker.io/netboxcommunity/netbox:v4.6-5.0.2
  valkey_image: docker.io/valkey/valkey:9.1-alpine

  timezone: Europe/Stockholm
  allowed_hosts:
    - netbox.example.invalid
  csrf_trusted_origins: []

  web:
    hostname: netbox
    http_port: 8001

  ldap:
    enabled: false
    server_uri: ldaps://openldap:1636
    start_tls: false
    validate_certs: true
    allow_plaintext: false
    ca_path: ""
    ca_container_path: /etc/ssl/certs/tmnt-openldap-ca.crt
    bind_dn: ""
    bind_password: ""
    user_search_base_dn: ou=people,dc=example,dc=org
    user_search_attr: uid
    group_search_base_dn: ou=groups,dc=example,dc=org
    group_search_class: groupOfNames
    group_type: GroupOfNamesType
    require_group_dn: ""
    admin_group_dn: ""
    superuser_group_dn: ""
    attr_first_name: givenName
    attr_last_name: sn
    attr_email: mail
    cache_timeout: "300"
    mirror_groups: "true"
    network:
      name: tmnt_openldap
      external: true

  data_dirs:
    config: /opt/docker/netbox/config
    redis: /opt/docker/netbox/redis
    redis_cache: /opt/docker/netbox/redis-cache
    media: /opt/docker/netbox/media
    reports: /opt/docker/netbox/reports
    scripts: /opt/docker/netbox/scripts

  database:
    host: postgres
    port: "5432"
    name: netbox
    user: netbox
    password: ""
    conn_max_age: "300"
    disable_server_side_cursors: "False"
    network:
      name: tmnt_postgres
      external: true

  redis:
    password: ""
    database: "0"
    cache_password: ""
    cache_database: "1"

  security:
    secret_key: ""
    api_token_pepper_1: ""

  email:
    server: localhost
    port: "25"
    username: netbox
    password: ""
    from: netbox@example.invalid
    use_ssl: "false"
    use_tls: "false"
    timeout: "5"

  options:
    cors_origin_allow_all: "True"
    graphql_enabled: "true"
    metrics_enabled: "false"
    webhooks_enabled: "true"
    release_check_url: https://api.github.com/repos/netbox-community/netbox/releases
    skip_superuser: "true"

  superuser:
    enabled: false
    name: admin
    email: admin@example.invalid
    password: ""
    api_token: ""

  services:
    worker: true
    housekeeping: true

  extra_env: {}
  volumes: []
