---
- name: Check for a native or WSL NVIDIA device
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /dev/nvidiactl
    - /dev/dxg
  register: service_docker_nvidia_devices

- name: Require an NVIDIA device supplied by the host operating system
  ansible.builtin.assert:
    that:
      - service_docker_nvidia_devices.results | selectattr('stat.exists') | list | length > 0
    fail_msg: >-
      No NVIDIA device was found. Install the GPU driver on the physical host first.
      For WSL, install only the Windows NVIDIA driver; this role intentionally does not install a Linux driver.

- name: Configure NVIDIA Container Toolkit on Debian family
  when: ansible_facts.os_family == 'Debian'
  block:
    - name: Remove legacy NVIDIA Container Toolkit apt source
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/nvidia-container-toolkit.list
        state: absent

    - name: Configure NVIDIA Container Toolkit apt repository
      vars:
        service_docker_nvidia_arch_map:
          x86_64: amd64
          aarch64: arm64
        service_docker_nvidia_arch: >-
          {{ service_docker_nvidia_arch_map.get(ansible_facts.architecture, ansible_facts.architecture) }}
      ansible.builtin.deb822_repository:
        name: "{{ service_docker.gpu.nvidia.apt.repository_name }}"
        types:
          - deb
        uris:
          - "{{ service_docker.gpu.nvidia.apt.repository_url }}/{{ service_docker_nvidia_arch }}"
        suites:
          - /
        architectures:
          - "{{ service_docker_nvidia_arch }}"
        signed_by: "{{ service_docker.gpu.nvidia.apt.key_url }}"
        state: present
        enabled: true
        mode: "0644"

    - name: Install NVIDIA Container Toolkit packages on Debian family
      ansible.builtin.apt:
        name: "{{ service_docker.gpu.nvidia.packages }}"
        state: "{{ service_docker.gpu.nvidia.package_state }}"
        update_cache: true
        install_recommends: false

- name: Configure NVIDIA Container Toolkit on RedHat family
  when: ansible_facts.os_family == 'RedHat'
  block:
    - name: Configure NVIDIA Container Toolkit yum repository
      ansible.builtin.yum_repository:
        name: "{{ service_docker.gpu.nvidia.yum.repository_name }}"
        description: NVIDIA Container Toolkit Stable Repository
        baseurl: "{{ service_docker.gpu.nvidia.yum.repository_url }}"
        enabled: true
        gpgcheck: true
        repo_gpgcheck: false
        gpgkey: "{{ service_docker.gpu.nvidia.yum.gpgkey }}"

    - name: Install NVIDIA Container Toolkit packages on RedHat family
      ansible.builtin.package:
        name: "{{ service_docker.gpu.nvidia.packages }}"
        state: "{{ service_docker.gpu.nvidia.package_state }}"

- name: Enable automatic NVIDIA CDI refresh
  ansible.builtin.systemd:
    name: nvidia-cdi-refresh.path
    enabled: true
    state: started
    daemon_reload: true

- name: Check for the generated NVIDIA CDI specification
  ansible.builtin.stat:
    path: /var/run/cdi/nvidia.yaml
  register: service_docker_nvidia_cdi_spec

- name: Generate an initial NVIDIA CDI specification when missing
  ansible.builtin.command:
    argv:
      - /usr/bin/nvidia-ctk
      - cdi
      - generate
      - --output=/var/run/cdi/nvidia.yaml
    creates: /var/run/cdi/nvidia.yaml
  when:
    - not service_docker_nvidia_cdi_spec.stat.exists
    - not ansible_check_mode

- name: List NVIDIA CDI devices
  ansible.builtin.command:
    argv:
      - /usr/bin/nvidia-ctk
      - cdi
      - list
  register: service_docker_nvidia_cdi_devices
  changed_when: false
  when:
    - service_docker.gpu.verify | bool
    - not ansible_check_mode

- name: Verify the requested NVIDIA CDI device is available
  ansible.builtin.assert:
    that:
      - service_docker.gpu.device in service_docker_nvidia_cdi_devices.stdout_lines
    fail_msg: "The requested NVIDIA CDI device was not generated by nvidia-ctk."
  when:
    - service_docker.gpu.verify | bool
    - not ansible_check_mode
