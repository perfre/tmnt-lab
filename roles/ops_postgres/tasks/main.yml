---
- name: Validate ops_postgres configuration
  ansible.builtin.assert:
    that:
      - ops_postgres is mapping
      - ops_postgres.login_host | length > 0
      - ops_postgres.login_port | int >= 1024
      - ops_postgres.login_port | int <= 65535
      - ops_postgres.login_user | length > 0
      - ops_postgres.login_password | length >= 16
      - ops_postgres.login_password not in ['password', 'changeme', 'CHANGE_ME', 'admin']
      - ops_postgres.ssl_mode in ['disable', 'allow', 'prefer', 'require', 'verify-ca', 'verify-full']
      - ops_postgres.login_host in ['localhost', '127.0.0.1', '::1'] or ops_postgres.ssl_mode == 'verify-full'
      - ops_postgres.ssl_mode != 'verify-full' or ops_postgres.tls.ca_cert | length > 0
      - ops_postgres.users is sequence
      - ops_postgres.databases is sequence
      - ansible_facts["os_family"] in ops_postgres.driver_packages
      - (ops_postgres.users | map(attribute='name') | list | unique | length) == (ops_postgres.users | length)
      - (ops_postgres.databases | map(attribute='name') | list | unique | length) == (ops_postgres.databases | length)
    fail_msg: >-
      ops_postgres requires unique database/user definitions, a non-empty
      administrator credential, and either a loopback administrative connection
      or PostgreSQL ssl_mode=verify-full with a CA certificate.
  no_log: true

- name: Validate PostgreSQL user definitions
  ansible.builtin.assert:
    that:
      - item.name is string
      - item.name is match('^[A-Za-z0-9_]+$')
      - item.password is defined
      - item.password | length >= 16
      - item.password not in ['password', 'changeme', 'CHANGE_ME', 'admin']
      - item.state | default('present') in ['present', 'absent']
    fail_msg: >-
      Every ops_postgres user needs a safe name, supported state, and a non-empty
      password from inventory or a protected secret source.
  loop: "{{ ops_postgres.users }}"
  loop_control:
    label: "{{ item.name | default('undefined') }}"
  no_log: true

- name: Validate PostgreSQL database definitions
  ansible.builtin.assert:
    that:
      - item.name is string
      - item.name is match('^[A-Za-z0-9_]+$')
      - item.owner is string
      - item.owner in (ops_postgres.users | map(attribute='name') | list)
      - item.state | default('present') in ['present', 'absent']
    fail_msg: "Every ops_postgres database needs a safe name, declared owner, and supported state."
  loop: "{{ ops_postgres.databases }}"
  loop_control:
    label: "{{ item.name | default('undefined') }}"

- name: Install PostgreSQL Python driver
  ansible.builtin.package:
    name: "{{ ops_postgres.driver_packages[ansible_facts['os_family']] }}"
    state: present

- name: Wait for the PostgreSQL administrative endpoint
  ansible.builtin.wait_for:
    host: "{{ ops_postgres.login_host }}"
    port: "{{ ops_postgres.login_port }}"
    timeout: 120

- name: Create or update PostgreSQL application users from inventory
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    role_attr_flags: "{{ item.role_attr_flags | default('LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE') }}"
    state: "{{ item.state | default('present') }}"
    login_host: "{{ ops_postgres.login_host }}"
    login_port: "{{ ops_postgres.login_port }}"
    login_user: "{{ ops_postgres.login_user }}"
    login_password: "{{ ops_postgres.login_password }}"
    ssl_mode: "{{ ops_postgres.ssl_mode }}"
    ca_cert: "{{ ops_postgres.tls.ca_cert | default(omit, true) }}"
    ssl_cert: "{{ ops_postgres.tls.client_cert | default(omit, true) }}"
    ssl_key: "{{ ops_postgres.tls.client_key | default(omit, true) }}"
    trust_input: false
  loop: "{{ ops_postgres.users }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.state | default('present') == 'present'
  no_log: true
  diff: false

- name: Reconcile PostgreSQL databases from inventory
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.owner }}"
    encoding: "{{ item.encoding | default('UTF8') }}"
    state: "{{ item.state | default('present') }}"
    login_host: "{{ ops_postgres.login_host }}"
    login_port: "{{ ops_postgres.login_port }}"
    login_user: "{{ ops_postgres.login_user }}"
    login_password: "{{ ops_postgres.login_password }}"
    ssl_mode: "{{ ops_postgres.ssl_mode }}"
    ca_cert: "{{ ops_postgres.tls.ca_cert | default(omit, true) }}"
    ssl_cert: "{{ ops_postgres.tls.client_cert | default(omit, true) }}"
    ssl_key: "{{ ops_postgres.tls.client_key | default(omit, true) }}"
    trust_input: false
  loop: "{{ ops_postgres.databases }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  diff: false

- name: Remove explicitly absent PostgreSQL application users
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    state: absent
    login_host: "{{ ops_postgres.login_host }}"
    login_port: "{{ ops_postgres.login_port }}"
    login_user: "{{ ops_postgres.login_user }}"
    login_password: "{{ ops_postgres.login_password }}"
    ssl_mode: "{{ ops_postgres.ssl_mode }}"
    ca_cert: "{{ ops_postgres.tls.ca_cert | default(omit, true) }}"
    ssl_cert: "{{ ops_postgres.tls.client_cert | default(omit, true) }}"
    ssl_key: "{{ ops_postgres.tls.client_key | default(omit, true) }}"
    trust_input: false
  loop: "{{ ops_postgres.users }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.state | default('present') == 'absent'
  no_log: true
  diff: false
