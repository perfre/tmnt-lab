---
docker_freeradius:  # noqa: var-naming[no-role-prefix]
  project_name: freeradius
  project_dir: /opt/docker/freeradius
  docker_binary: /usr/bin/docker
  apply: true
  pull_policy: never
  build: always
  recreate: auto
  remove_orphans: true
  wait: true
  wait_timeout: 120
  restart: unless-stopped

  image_name: tmnt/freeradius:3.2-debian
  base_image: docker.io/library/debian:12-slim@sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241
  run_uid: "100"
  run_gid: "101"
  timezone: UTC

  bind_address: 127.0.0.1
  auth_port: 1812
  accounting_port: 1813
  publish: true

  config_dir: /opt/docker/freeradius/config
  run_dir: /opt/docker/freeradius/run
  log_dir: /opt/docker/freeradius/log

  clients: []

  ldap:
    enabled: false
    server_uri: ldaps://openldap:1636
    start_tls: false
    validate_certs: true
    allow_plaintext: false
    ca_path: ""
    ca_container_path: /etc/ssl/certs/tmnt-openldap-ca.crt
    bind_dn: ""
    bind_password: ""
    base_dn: dc=example,dc=org
    user_base_dn: ou=people,dc=example,dc=org
    user_filter: "(&(objectClass=posixAccount)(uid=%{User-Name}))"
    group_base_dn: ou=groups,dc=example,dc=org
    group_filter: "(&(objectClass=groupOfNames)(member=%{control:Ldap-UserDn}))"
    membership_attribute: memberOf
    tls_min_version: "1.2"
    require_cert: demand
    network:
      name: tmnt_openldap
      external: true

  resources:
    memory_limit: 256m
    cpus: "0.5"
    pids_limit: 128

  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
