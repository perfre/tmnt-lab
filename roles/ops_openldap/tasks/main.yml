  no_log: true

- name: Remove explicitly absent OpenLDAP extra entries
  community.general.ldap_entry:
    dn: "{{ item.dn }}"
    state: absent
    recursive: "{{ item.recursive | default(false) | bool }}"
    server_uri: "{{ ops_openldap.server_uri }}"
    start_tls: "{{ ops_openldap.start_tls | bool }}"
