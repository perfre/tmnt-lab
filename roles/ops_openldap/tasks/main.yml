    state: exact
    server_uri: "{{ ops_openldap.server_uri }}"
    start_tls: "{{ ops_openldap.start_tls | bool }}"
    validate_certs: "{{ ops_openldap.validate_certs | bool }}"
    ca_path: "{{ ops_openldap.ca_path | default(omit, true) }}"
    bind_dn: "{{ ops_openldap.bind_dn }}"
    bind_pw: "{{ ops_openldap.bind_password }}"
    referrals_chasing: "{{ ops_openldap.referrals_chasing }}"
  loop: "{{ ops_openldap.extra_entries }}"
  loop_control:
    label: "{{ item.dn }}"
  when:
    - ops_openldap.apply | bool
    - item.state | default('present') == 'present'
  no_log: true
  diff: false

