    - item.state | default('present') == 'absent'
  no_log: true

- name: Remove explicitly absent OpenLDAP users
  community.general.ldap_entry:
    dn: "{{ item.dn | default('uid=' ~ item.uid ~ ',' ~ ops_openldap.users_ou_dn) }}"
    state: absent
    recursive: "{{ item.recursive | default(false) | bool }}"
