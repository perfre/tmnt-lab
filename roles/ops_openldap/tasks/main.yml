  community.general.ldap_entry:
    dn: "{{ item.dn | default('cn=' ~ item.cn ~ ',' ~ ops_openldap.groups_ou_dn) }}"
    objectClass: "{{ item.object_classes | default(ops_openldap.group_defaults.object_classes) }}"
