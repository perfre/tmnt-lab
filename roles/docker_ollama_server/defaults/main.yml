---
docker_ollama_server:
  project_name: ollama-server
  project_dir: /opt/docker/ollama-server
  docker_binary: /usr/bin/docker
  container_name: ollama_server
  apply: true
  pull_policy: always
  recreate: auto
  remove_orphans: true
  wait: true
  wait_timeout: 300
  restart: unless-stopped

  # Safe non-lab defaults publish no unauthenticated API port.
  lab_mode: false
  image: docker.io/ollama/ollama:0.32.5@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
  data_dir: /opt/docker/ollama-server/models
  runtime_user:
    uid: "1000"
    gid: "1000"

  api:
    publish: false
    bind_address: 127.0.0.1
    port: 11434

  ingress:
    enabled: false
    external: true
    network_name: ""

  gpu:
    enabled: true
    devices:
      - nvidia.com/gpu=all

  server:
    context_length: "4096"
    max_loaded_models: "2"
    num_parallel: "1"
    max_queue: "64"
    keep_alive: "-1"
    flash_attention: "1"
    kv_cache_type: q8_0
    no_cloud: "1"

  resources:
    memory_limit: 16g
    cpus: "8.0"
    pids_limit: 512

  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

  extra_env: {}
