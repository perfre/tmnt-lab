---
- name: Determine LDAP Account Manager web TLS certificate source
  ansible.builtin.set_fact:
    docker_ldap_account_manager_web_tls_any_provided: >-
      {{
        (docker_ldap_account_manager.web.tls.ca_path | length > 0)
        or (docker_ldap_account_manager.web.tls.cert_path | length > 0)
        or (docker_ldap_account_manager.web.tls.key_path | length > 0)
      }}
    docker_ldap_account_manager_web_tls_all_provided: >-
      {{
        (docker_ldap_account_manager.web.tls.ca_path | length > 0)
        and (docker_ldap_account_manager.web.tls.cert_path | length > 0)
        and (docker_ldap_account_manager.web.tls.key_path | length > 0)
      }}
    docker_ldap_account_manager_web_tls_ca_file: >-
      {{
        (docker_ldap_account_manager.web.tls.ca_path | length > 0)
        | ternary(
            docker_ldap_account_manager.web.tls.ca_path,
            docker_ldap_account_manager.web.tls.pki_dir ~ '/ca.crt'
          )
      }}
    docker_ldap_account_manager_web_tls_cert_file: >-
      {{
        (docker_ldap_account_manager.web.tls.cert_path | length > 0)
        | ternary(
            docker_ldap_account_manager.web.tls.cert_path,
            docker_ldap_account_manager.web.tls.pki_dir ~ '/lam.crt'
          )
      }}
    docker_ldap_account_manager_web_tls_key_file: >-
      {{
        (docker_ldap_account_manager.web.tls.key_path | length > 0)
        | ternary(
            docker_ldap_account_manager.web.tls.key_path,
            docker_ldap_account_manager.web.tls.pki_dir ~ '/lam.key'
          )
      }}

- name: Validate docker_ldap_account_manager configuration
  ansible.builtin.assert:
    that:
      - docker_ldap_account_manager is mapping
      - docker_ldap_account_manager.project_name is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]+$')
      - docker_ldap_account_manager.project_dir is match('^/\\S+$')
      - docker_ldap_account_manager.image is not search(':latest($|@)')
      - docker_ldap_account_manager.image is search('@sha256:[0-9a-f]{64}$')
      - docker_ldap_account_manager.config_dir is match('^/\\S+$')
      - docker_ldap_account_manager.main_config_dir is match('^/\\S+$')
      - docker_ldap_account_manager.secrets_dir is match('^/\\S+$')
      - docker_ldap_account_manager.ldap.server_url is match('^ldaps://[^/]+:[0-9]+$')
      - docker_ldap_account_manager.ldap.base_dn is match('^[A-Za-z][A-Za-z0-9-]*=[^,=]+(,[A-Za-z][A-Za-z0-9-]*=[^,=]+)*$')
      - docker_ldap_account_manager.ldap.users_dn is search(',' ~ (docker_ldap_account_manager.ldap.base_dn | regex_escape) ~ '$')
      - docker_ldap_account_manager.ldap.groups_dn is search(',' ~ (docker_ldap_account_manager.ldap.base_dn | regex_escape) ~ '$')
      - docker_ldap_account_manager.ldap.bind_dn is search(',' ~ (docker_ldap_account_manager.ldap.base_dn | regex_escape) ~ '$')
      - docker_ldap_account_manager.ldap.ca_path | length > 0
      - docker_ldap_account_manager.ldap.validate_certs | bool
      - docker_ldap_account_manager.ldap.network.name | length > 0
      - docker_ldap_account_manager.configuration.password | length >= 16
      - docker_ldap_account_manager.configuration.password not in ['password', 'changeme', 'CHANGE_ME', 'admin']
      - docker_ldap_account_manager.web.hostname | length > 0
      - docker_ldap_account_manager.web.https_port | int >= 1024
      - docker_ldap_account_manager.web.https_port | int <= 65535
      - not docker_ldap_account_manager.web.publish | bool or docker_ldap_account_manager.web.bind_address | length > 0
      - not docker_ldap_account_manager_web_tls_any_provided | bool or docker_ldap_account_manager_web_tls_all_provided | bool
      - docker_ldap_account_manager.web.tls.leaf_validity_days | int <= 397
      - docker_ldap_account_manager.web.tls.renew_before_days | int > 0
      - docker_ldap_account_manager.web.tls.renew_before_days | int < docker_ldap_account_manager.web.tls.leaf_validity_days | int
      - docker_ldap_account_manager.web.tls.subject_alt_names is sequence
      - docker_ldap_account_manager.web.tls.subject_alt_names | length > 0
      - docker_ldap_account_manager.proxy.image is not search(':latest($|@)')
    fail_msg: >-
      docker_ldap_account_manager requires a digest-pinned LAM image, verified LDAPS,
      a CA path for the LDAP server, a strong inventory-supplied LAM/profile password,
      and either all web TLS host paths or none so the role can generate local web TLS.

- name: Ensure LDAP Account Manager project directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ docker_ldap_account_manager.project_dir }}"
      owner: root
      group: root
      mode: "0750"
    - path: "{{ docker_ldap_account_manager.config_dir }}"
      owner: "{{ docker_ldap_account_manager.run_uid }}"
      group: "{{ docker_ldap_account_manager.run_gid }}"
      mode: "0750"
    - path: "{{ docker_ldap_account_manager.main_config_dir }}"
      owner: "{{ docker_ldap_account_manager.run_uid }}"
      group: "{{ docker_ldap_account_manager.run_gid }}"
      mode: "0750"
    - path: "{{ docker_ldap_account_manager.secrets_dir }}"
      owner: root
      group: "{{ docker_ldap_account_manager.run_gid }}"
      mode: "0750"
    - path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}"
      owner: root
      group: "101"
      mode: "0750"
  loop_control:
    label: "{{ item.path }}"

- name: Generate LDAP Account Manager web local CA private key
  community.crypto.openssl_privatekey:
    path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}/ca.key"
    type: ECC
    curve: secp384r1
    owner: root
    group: root
    mode: "0600"
  when: not docker_ldap_account_manager_web_tls_all_provided | bool
  no_log: true
  notify: Restart docker ldap account manager compose

- name: Generate LDAP Account Manager web local CA certificate request
  community.crypto.openssl_csr:
    path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}/ca.csr"
    privatekey_path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}/ca.key"
    common_name: "{{ docker_ldap_account_manager.web.tls.ca_common_name }}"
    basic_constraints:
      - CA:TRUE
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
      - cRLSign
    key_usage_critical: true
    use_common_name_for_san: false
    owner: root
    group: root
    mode: "0600"
  when: not docker_ldap_account_manager_web_tls_all_provided | bool
  no_log: true
  notify: Restart docker ldap account manager compose

- name: Issue LDAP Account Manager web local CA certificate
  community.crypto.x509_certificate:
    path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}/ca.crt"
    privatekey_path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}/ca.key"
    csr_path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}/ca.csr"
    provider: selfsigned
    selfsigned_not_after: +3650d
    owner: root
    group: root
    mode: "0644"
  when: not docker_ldap_account_manager_web_tls_all_provided | bool
  no_log: true
  notify: Restart docker ldap account manager compose

- name: Generate LDAP Account Manager web TLS private key
  community.crypto.openssl_privatekey:
    path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}/lam.key"
    type: ECC
    curve: secp384r1
    owner: root
    group: "101"
    mode: "0640"
  when: not docker_ldap_account_manager_web_tls_all_provided | bool
  no_log: true
  notify: Restart docker ldap account manager compose

- name: Generate LDAP Account Manager web TLS certificate request
  community.crypto.openssl_csr:
    path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}/lam.csr"
    privatekey_path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}/lam.key"
    common_name: "{{ docker_ldap_account_manager.web.tls.leaf_common_name }}"
    subject_alt_name: "{{ docker_ldap_account_manager.web.tls.subject_alt_names }}"
    use_common_name_for_san: false
    basic_constraints:
      - CA:FALSE
    basic_constraints_critical: true
    key_usage:
      - digitalSignature
      - keyAgreement
    key_usage_critical: true
    extended_key_usage:
      - serverAuth
    owner: root
    group: root
    mode: "0644"
  when: not docker_ldap_account_manager_web_tls_all_provided | bool
  no_log: true
  notify: Restart docker ldap account manager compose

- name: Check for an existing LDAP Account Manager web TLS certificate
  ansible.builtin.stat:
    path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}/lam.crt"
  register: docker_ldap_account_manager_leaf_certificate
  when: not docker_ldap_account_manager_web_tls_all_provided | bool

- name: Inspect LDAP Account Manager web TLS certificate renewal window
  community.crypto.x509_certificate_info:
    path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}/lam.crt"
    valid_at:
      renewal_window: "+{{ docker_ldap_account_manager.web.tls.renew_before_days }}d"
  register: docker_ldap_account_manager_leaf_certificate_info
  when:
    - not docker_ldap_account_manager_web_tls_all_provided | bool
    - docker_ldap_account_manager_leaf_certificate.stat.exists

- name: Issue or renew LDAP Account Manager web TLS certificate
  community.crypto.x509_certificate:
    path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}/lam.crt"
    csr_path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}/lam.csr"
    ownca_path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}/ca.crt"
    ownca_privatekey_path: "{{ docker_ldap_account_manager.web.tls.pki_dir }}/ca.key"
    provider: ownca
    ownca_not_after: "+{{ docker_ldap_account_manager.web.tls.leaf_validity_days }}d"
    force: >-
      {{
        (not docker_ldap_account_manager_leaf_certificate.stat.exists)
        or (not (docker_ldap_account_manager_leaf_certificate_info.valid_at.renewal_window | default(false)))
      }}
    owner: root
    group: root
    mode: "0644"
  when: not docker_ldap_account_manager_web_tls_all_provided | bool
  no_log: true
  notify: Restart docker ldap account manager compose

- name: Render LDAP Account Manager secret files
  ansible.builtin.copy:
    content: "{{ docker_ldap_account_manager.configuration.password }}\n"
    dest: "{{ docker_ldap_account_manager.secrets_dir }}/lam-password"
    owner: root
    group: "{{ docker_ldap_account_manager.run_gid }}"
    mode: "0640"
  no_log: true
  diff: false
  notify: Restart docker ldap account manager compose

- name: Render LDAP Account Manager LDAP client configuration
  ansible.builtin.template:
    src: ldap.conf.j2
    dest: "{{ docker_ldap_account_manager.project_dir }}/ldap.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker ldap account manager compose

- name: Render LDAP Account Manager TLS proxy configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ docker_ldap_account_manager.project_dir }}/nginx.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker ldap account manager compose

- name: Render LDAP Account Manager Docker Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ docker_ldap_account_manager.project_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker ldap account manager compose

- name: Install LDAP Account Manager Compose systemd unit
  ansible.builtin.template:
    src: docker-ldap-account-manager.service.j2
    dest: /etc/systemd/system/docker-ldap-account-manager.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker ldap account manager compose

- name: Enable LDAP Account Manager Compose systemd unit
  ansible.builtin.systemd:
    name: docker-ldap-account-manager
    enabled: true
    daemon_reload: true

- name: Start or update LDAP Account Manager Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ docker_ldap_account_manager.project_dir }}"
    project_name: "{{ docker_ldap_account_manager.project_name }}"
    files:
      - compose.yml
    docker_cli: "{{ docker_ldap_account_manager.docker_binary }}"
    state: present
    pull: "{{ docker_ldap_account_manager.pull_policy }}"
    recreate: "{{ docker_ldap_account_manager.recreate }}"
    remove_orphans: "{{ docker_ldap_account_manager.remove_orphans | bool }}"
    wait: "{{ docker_ldap_account_manager.wait | bool }}"
    wait_timeout: "{{ docker_ldap_account_manager.wait_timeout }}"
  when: docker_ldap_account_manager.apply | bool
