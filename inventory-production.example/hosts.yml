---
all:
  vars:
    ansible_user: automation
  children:
    docker_hosts:
      vars:
        service_docker:
          state: present
          gpu:
            enabled: true
            vendor: nvidia
            mode: cdi
            verify: true
            device: nvidia.com/gpu=all
      hosts:
        ollama-prod:
          ansible_host: ollama-prod.example.invalid

    ollama_server:
      vars:
        docker_ollama_server:
          api:
            publish: false
          ingress:
            enabled: true
            external: true
            network_name: secured_ai_ingress
          gpu:
            enabled: true
            devices:
              - nvidia.com/gpu=all
        ops_ollama_models:
          models:
            - name: qwen3:8b
              type: llm
              state: present
              warm: false
              license: Apache-2.0
              source_url: https://ollama.com/library/qwen3:8b
            - name: bge-m3:latest
              type: embedding
              state: present
              warm: false
              license: MIT
              source_url: https://ollama.com/library/bge-m3
          warm_api:
            enabled: false
      hosts:
        ollama-prod:

    # Add production OpenLDAP/LAM hosts here when you have real secret material,
    # certificate paths or an intentional generated-CA plan, and explicit bind
    # addresses. See roles/docker_openldap, roles/ops_openldap, and
    # roles/docker_ldap_account_manager for the required variable shape.
    ldap:
      hosts: {}

    # Empty groups keep the single shared playbook valid without enabling roles
    # whose production inventory has not been supplied in this example.
    openbao:
      hosts: {}
    mariadb:
      hosts: {}
    postgres:
      hosts: {}
    atlassian_lab:
      hosts: {}
    zabbix:
      hosts: {}
    librenms:
      hosts: {}
    netbox:
      hosts: {}
    zabbix_testhost:
      hosts: {}
    snmpv3_testhost:
      hosts: {}
    network_device_emulator:
      hosts: {}
