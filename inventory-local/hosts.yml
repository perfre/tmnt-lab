all:
  vars:
    ansible_host: localhost
    ansible_connection: local
  children:
    docker_hosts:
      vars:
        service_docker:
          gpu:
            enabled: true
            vendor: nvidia
            mode: cdi
            verify: true
            device: nvidia.com/gpu=all
      hosts:
        docker-host01:
    docker:
      children:
        gitlab:
          hosts:
            gitlab01:
        ldap:
          vars:
            docker_openldap:
              timezone: Europe/Stockholm
              suffix: dc=tmnt,dc=localhost
              organization: TMNT Lab Directory
              admin:
                dn: cn=admin,dc=tmnt,dc=localhost
                password: LAB_ONLY_OPENLDAP_ADMIN_PASSWORD_DO_NOT_REUSE
                password_hash_salt: abcdefghijklmnop
              tls:
                ca_common_name: tmnt-lab OpenLDAP local CA
                leaf_common_name: ldap.localhost
                subject_alt_names:
                  - DNS:localhost
                  - DNS:ldap.localhost
                  - DNS:openldap
                  - IP:127.0.0.1
                  - IP:::1
              ldaps:
                publish: true
                bind_address: 127.0.0.1
                published_port: 1636
            ops_openldap:
              server_uri: ldaps://127.0.0.1:1636
              ca_path: /opt/docker/openldap/pki/ca.crt
              bind_dn: cn=admin,dc=tmnt,dc=localhost
              bind_password: LAB_ONLY_OPENLDAP_ADMIN_PASSWORD_DO_NOT_REUSE
              base_dn: dc=tmnt,dc=localhost
              users_ou_dn: ou=people,dc=tmnt,dc=localhost
              groups_ou_dn: ou=groups,dc=tmnt,dc=localhost
              base:
                object_classes:
                  - top
                  - dcObject
                  - organization
                attributes:
                  dc: tmnt
                  o: TMNT Lab Directory
              organizational_units:
                - name: people
                  attributes:
                    ou: people
                    description: Human user accounts
                - name: groups
                  attributes:
                    ou: groups
                    description: Access groups
                - name: services
                  attributes:
                    ou: services
                    description: Service bind accounts
              extra_entries:
                - dn: cn=netbox,ou=services,dc=tmnt,dc=localhost
                  object_classes:
                    - top
                    - organizationalRole
                    - simpleSecurityObject
                  attributes:
                    cn: netbox
                    description: NetBox LDAP bind account
                  password: LAB_ONLY_NETBOX_LDAP_BIND_PASSWORD_DO_NOT_REUSE
                  password_hash_salt: netbox01
                - dn: cn=poweradmin,ou=services,dc=tmnt,dc=localhost
                  object_classes:
                    - top
                    - organizationalRole
                    - simpleSecurityObject
                  attributes:
                    cn: poweradmin
                    description: Poweradmin LDAP bind account
                  password: LAB_ONLY_POWERADMIN_LDAP_BIND_PASSWORD_DO_NOT_REUSE
                  password_hash_salt: padmin01
                - dn: cn=librenms,ou=services,dc=tmnt,dc=localhost
                  object_classes:
                    - top
                    - organizationalRole
                    - simpleSecurityObject
                  attributes:
                    cn: librenms
                    description: LibreNMS LDAP bind account
                  password: LAB_ONLY_LIBRENMS_LDAP_BIND_PASSWORD_DO_NOT_REUSE
                  password_hash_salt: libre001
                - dn: cn=zabbix,ou=services,dc=tmnt,dc=localhost
                  object_classes:
                    - top
                    - organizationalRole
                    - simpleSecurityObject
                  attributes:
                    cn: zabbix
                    description: Zabbix LDAP bind account
                  password: LAB_ONLY_ZABBIX_LDAP_BIND_PASSWORD_DO_NOT_REUSE
                  password_hash_salt: zabbix01
                - dn: cn=openbao,ou=services,dc=tmnt,dc=localhost
                  object_classes:
                    - top
                    - organizationalRole
                    - simpleSecurityObject
                  attributes:
                    cn: openbao
                    description: OpenBao LDAP bind account
                  password: LAB_ONLY_OPENBAO_LDAP_BIND_PASSWORD_DO_NOT_REUSE
                  password_hash_salt: openbao1
                - dn: cn=freeradius,ou=services,dc=tmnt,dc=localhost
                  object_classes:
                    - top
                    - organizationalRole
                    - simpleSecurityObject
                  attributes:
                    cn: freeradius
                    description: FreeRADIUS LDAP bind account
                  password: LAB_ONLY_FREERADIUS_LDAP_BIND_PASSWORD_DO_NOT_REUSE
                  password_hash_salt: radius01
                - dn: cn=tacacs,ou=services,dc=tmnt,dc=localhost
                  object_classes:
                    - top
                    - organizationalRole
                    - simpleSecurityObject
                  attributes:
                    cn: tacacs
                    description: TACACS+ LDAP bind account
                  password: LAB_ONLY_TACACS_LDAP_BIND_PASSWORD_DO_NOT_REUSE
                  password_hash_salt: tacacs01
              users:
                - uid: alice
                  attributes:
                    uid: alice
                    cn: Alice Example
                    sn: Example
                    givenName: Alice
                    mail: alice@localhost
                    uidNumber: "10000"
                    gidNumber: "10000"
                    homeDirectory: /home/alice
                    loginShell: /bin/bash
                  password: LAB_ONLY_ALICE_LDAP_PASSWORD_DO_NOT_REUSE
                  password_hash_salt: aliceSalt1
              groups:
                - cn: lab-admins
                  attributes:
                    cn: lab-admins
                    member:
                      - uid=alice,ou=people,dc=tmnt,dc=localhost
                - cn: netbox-users
                  attributes:
                    cn: netbox-users
                    member:
                      - uid=alice,ou=people,dc=tmnt,dc=localhost
                - cn: netbox-admins
                  attributes:
                    cn: netbox-admins
                    member:
                      - uid=alice,ou=people,dc=tmnt,dc=localhost
                - cn: poweradmin-users
                  attributes:
                    cn: poweradmin-users
                    member:
                      - uid=alice,ou=people,dc=tmnt,dc=localhost
                - cn: poweradmin-admins
                  attributes:
                    cn: poweradmin-admins
                    member:
                      - uid=alice,ou=people,dc=tmnt,dc=localhost
                - cn: librenms-admins
                  attributes:
                    cn: librenms-admins
                    member:
                      - uid=alice,ou=people,dc=tmnt,dc=localhost
                - cn: zabbix-admins
                  attributes:
                    cn: zabbix-admins
                    member:
                      - uid=alice,ou=people,dc=tmnt,dc=localhost
                - cn: openbao-admins
                  attributes:
                    cn: openbao-admins
                    member:
                      - uid=alice,ou=people,dc=tmnt,dc=localhost
                - cn: radius-users
                  attributes:
                    cn: radius-users
                    member:
                      - uid=alice,ou=people,dc=tmnt,dc=localhost
                - cn: tacacs-admins
                  attributes:
                    cn: tacacs-admins
                    member:
                      - uid=alice,ou=people,dc=tmnt,dc=localhost
            docker_ldap_account_manager:
              timezone: Europe/Stockholm
              ldap:
                server_url: ldaps://openldap:1636
                base_dn: dc=tmnt,dc=localhost
                users_dn: ou=people,dc=tmnt,dc=localhost
                groups_dn: ou=groups,dc=tmnt,dc=localhost
                bind_dn: cn=admin,dc=tmnt,dc=localhost
                ca_path: /opt/docker/openldap/pki/ca.crt
                network:
                  name: tmnt_openldap
                  external: true
              configuration:
                password: LAB_ONLY_OPENLDAP_ADMIN_PASSWORD_DO_NOT_REUSE
              web:
                publish: true
                bind_address: 127.0.0.1
                hostname: lam.localhost
                https_port: 8446
                tls:
                  ca_common_name: tmnt-lab LAM local CA
                  leaf_common_name: lam.localhost
                  subject_alt_names:
                    - DNS:localhost
                    - DNS:lam.localhost
                    - IP:127.0.0.1
                    - IP:::1
          hosts:
            ldap01:
        librenms:
          vars:
            docker_librenms:
              database:
                host: mariadb
                port: "3306"
                name: librenms
                user: librenms
                password: LAB_ONLY_LIBRENMS_MARIADB_PASSWORD_DO_NOT_REUSE
                network:
                  name: tmnt_mariadb
                  external: true
              ldap:
                enabled: true
                ca_path: /opt/docker/openldap/pki/ca.crt
                network:
                  name: tmnt_openldap
                  external: true
            ops_librenms_ldap:
              enabled: true
              server_uri: ldaps://openldap:1636
              ca_container_path: /opt/librenms/ldap-ca-cert
              bind_dn: cn=librenms,ou=services,dc=tmnt,dc=localhost
              bind_password: LAB_ONLY_LIBRENMS_LDAP_BIND_PASSWORD_DO_NOT_REUSE
              base_dn: ou=people,dc=tmnt,dc=localhost
              user_filter: "(&(objectClass=posixAccount)(uid=%u)(memberOf=cn=librenms-admins,ou=groups,dc=tmnt,dc=localhost))"
              group_base_dn: ou=groups,dc=tmnt,dc=localhost
              admin_group_cn: librenms-admins
          hosts:
            librenms01:
        mariadb:
          vars:
            docker_mariadb:
              bind_address: 127.0.0.1
              admin_password: LAB_ONLY_MARIADB_ADMIN_PASSWORD_DO_NOT_REUSE
              network:
                name: tmnt_mariadb
                alias: mariadb
            ops_mariadb:
              login_password: LAB_ONLY_MARIADB_ADMIN_PASSWORD_DO_NOT_REUSE
              databases:
                - name: librenms
                  encoding: utf8mb4
                  collation: utf8mb4_unicode_ci
                - name: powerdns
                  encoding: utf8mb4
                  collation: utf8mb4_unicode_ci
              users:
                - name: librenms
                  host: "%"
                  password: LAB_ONLY_LIBRENMS_MARIADB_PASSWORD_DO_NOT_REUSE
                  privileges:
                    "librenms.*": ALL
                - name: powerdns
                  host: "%"
                  password: LAB_ONLY_POWERDNS_MARIADB_PASSWORD_DO_NOT_REUSE
                  privileges:
                    "powerdns.*": SELECT,INSERT,UPDATE,DELETE
                - name: poweradmin
                  host: "%"
                  password: LAB_ONLY_POWERADMIN_MARIADB_PASSWORD_DO_NOT_REUSE
                  privileges:
                    "powerdns.*": ALL
          hosts:
            mariadb01:
        minio:
          hosts:
            minio01:
        netbox:
          vars:
            docker_netbox:
              allowed_hosts:
                - netbox.localhost
                - localhost
                - 127.0.0.1
              database:
                host: postgres
                port: "5432"
                name: netbox
                user: netbox
                password: LAB_ONLY_NETBOX_POSTGRES_PASSWORD_DO_NOT_REUSE
                network:
                  name: tmnt_postgres
                  external: true
              redis:
                password: LAB_ONLY_NETBOX_REDIS_PASSWORD_DO_NOT_REUSE
                cache_password: LAB_ONLY_NETBOX_REDIS_CACHE_PASSWORD_DO_NOT_REUSE
              security:
                secret_key: LAB_ONLY_NETBOX_SECRET_KEY_0123456789_DO_NOT_REUSE_0123456789
                api_token_pepper_1: LAB_ONLY_NETBOX_API_TOKEN_PEPPER_DO_NOT_REUSE_0123456789
              ldap:
                enabled: true
                server_uri: ldaps://openldap:1636
                ca_path: /opt/docker/openldap/pki/ca.crt
                bind_dn: cn=netbox,ou=services,dc=tmnt,dc=localhost
                bind_password: LAB_ONLY_NETBOX_LDAP_BIND_PASSWORD_DO_NOT_REUSE
                user_search_base_dn: ou=people,dc=tmnt,dc=localhost
                group_search_base_dn: ou=groups,dc=tmnt,dc=localhost
                require_group_dn: cn=netbox-users,ou=groups,dc=tmnt,dc=localhost
                admin_group_dn: cn=netbox-admins,ou=groups,dc=tmnt,dc=localhost
                superuser_group_dn: cn=netbox-admins,ou=groups,dc=tmnt,dc=localhost
                network:
                  name: tmnt_openldap
                  external: true
          hosts:
            netbox01:
        nomad:
          children:
            nomad_server:
              hosts:
                nomad-srv01:
                nomad-srv02:
                nomad-srv03:
            nomad_client:
              hosts:
                nomad-client01:
                nomad-client02:
        openbao:
          hosts:
            openbao01:
        ollama_server:
          vars:
            docker_ollama_server:
              api:
                publish: true
                bind_address: 127.0.0.1
                port: 11434
              gpu:
                enabled: true
                devices:
                  - nvidia.com/gpu=all
            ops_ollama_models:
              models:
                - name: qwen3:8b
                  type: llm
                  state: present
                  warm: true
                  license: Apache-2.0
                  source_url: https://ollama.com/library/qwen3:8b
                - name: bge-m3:latest
                  type: embedding
                  state: present
                  warm: true
                  license: MIT
                  source_url: https://ollama.com/library/bge-m3
              warm_api:
                enabled: true
                scheme: http
                host: 127.0.0.1
                port: 11434
                validate_certs: false
                keep_alive: -1
          hosts:
            ollama-server01:
        atlassian_lab:
          vars:
            docker_atlassian_lab:
              database:
                network:
                  name: tmnt_postgres
                  external: true
                jira:
                  host: postgres
                  port: "5432"
                  name: jira
                  user: jira
                  password: LAB_ONLY_JIRA_DB_PASSWORD_DO_NOT_REUSE
                confluence:
                  host: postgres
                  port: "5432"
                  name: confluence
                  user: confluence
                  password: LAB_ONLY_CONFLUENCE_DB_PASSWORD_DO_NOT_REUSE
          hosts:
            atlassian-lab01:
        postgres:
          vars:
            docker_postgres:
              bind_address: 127.0.0.1
              admin_password: LAB_ONLY_POSTGRES_ADMIN_PASSWORD_DO_NOT_REUSE
              network:
                name: tmnt_postgres
                alias: postgres
            # Canonical lab bootstrap manifest. Add every new PostgreSQL-backed
            # system's user and database here in the same change as its role.
            ops_postgres:
              login_password: LAB_ONLY_POSTGRES_ADMIN_PASSWORD_DO_NOT_REUSE
              users:
                - name: jira
                  password: LAB_ONLY_JIRA_DB_PASSWORD_DO_NOT_REUSE
                - name: confluence
                  password: LAB_ONLY_CONFLUENCE_DB_PASSWORD_DO_NOT_REUSE
                - name: netbox
                  password: LAB_ONLY_NETBOX_POSTGRES_PASSWORD_DO_NOT_REUSE
                - name: zabbix
                  password: LAB_ONLY_ZABBIX_POSTGRES_PASSWORD_DO_NOT_REUSE
              databases:
                - name: jira
                  owner: jira
                - name: confluence
                  owner: confluence
                - name: netbox
                  owner: netbox
                - name: zabbix
                  owner: zabbix
          hosts:
            postgres01:
        powerdns:
          vars:
            docker_powerdns:
              bind_address: 127.0.0.1
              database:
                host: mariadb
                port: "3306"
                name: powerdns
                user: powerdns
                password: LAB_ONLY_POWERDNS_MARIADB_PASSWORD_DO_NOT_REUSE
                network:
                  name: tmnt_mariadb
                  external: true
              api:
                key: LAB_ONLY_POWERDNS_API_KEY_DO_NOT_REUSE
                webserver_password: LAB_ONLY_POWERDNS_WEBSERVER_PASSWORD_DO_NOT_REUSE
            docker_powerdns_recursor:
              bind_address: 127.0.0.1
            docker_poweradmin:
              bind_address: 127.0.0.1
              web:
                publish: true
                hostname: poweradmin.localhost
                https_port: 8445
              database:
                host: mariadb
                port: "3306"
                name: powerdns
                user: poweradmin
                password: LAB_ONLY_POWERADMIN_MARIADB_PASSWORD_DO_NOT_REUSE
                network:
                  name: tmnt_mariadb
                  external: true
              powerdns_api:
                url: http://powerdns:8081
                key: LAB_ONLY_POWERDNS_API_KEY_DO_NOT_REUSE
                network:
                  name: tmnt_powerdns_api
                  external: true
              admin:
                password: LAB_ONLY_POWERADMIN_ADMIN_PASSWORD_DO_NOT_REUSE
              session_key: LAB_ONLY_POWERADMIN_SESSION_KEY_DO_NOT_REUSE_0123456789abcdef
              ldap:
                enabled: true
                uri: ldaps://openldap:1636
                ca_path: /opt/docker/openldap/pki/ca.crt
                base_dn: ou=people,dc=tmnt,dc=localhost
                bind_dn: cn=poweradmin,ou=services,dc=tmnt,dc=localhost
                bind_password: LAB_ONLY_POWERADMIN_LDAP_BIND_PASSWORD_DO_NOT_REUSE
                user_attribute: uid
                search_filter: "(&(objectClass=posixAccount)(memberOf=cn=poweradmin-users,ou=groups,dc=tmnt,dc=localhost))"
                auto_provision: true
                groups_attribute: memberOf
                network:
                  name: tmnt_openldap
                  external: true
          hosts:
            powerdns01:
        radius:
          vars:
            docker_freeradius:
              timezone: Europe/Stockholm
              bind_address: 127.0.0.1
              clients:
                - name: local_lab
                  ipaddr: 0.0.0.0/0
                  secret: LAB_ONLY_RADIUS_SHARED_SECRET_DO_NOT_REUSE
              ldap:
                enabled: true
                server_uri: ldaps://openldap:1636
                ca_path: /opt/docker/openldap/pki/ca.crt
                bind_dn: cn=freeradius,ou=services,dc=tmnt,dc=localhost
                bind_password: LAB_ONLY_FREERADIUS_LDAP_BIND_PASSWORD_DO_NOT_REUSE
                base_dn: dc=tmnt,dc=localhost
                user_base_dn: ou=people,dc=tmnt,dc=localhost
                user_filter: "(&(objectClass=posixAccount)(uid=%{User-Name})(memberOf=cn=radius-users,ou=groups,dc=tmnt,dc=localhost))"
                group_base_dn: ou=groups,dc=tmnt,dc=localhost
                network:
                  name: tmnt_openldap
                  external: true
          hosts:
            radius01:
        tacacs:
          vars:
            docker_tacacs_plus:
              timezone: Europe/Stockholm
              bind_address: 127.0.0.1
              clients:
                - name: local_lab
                  address: 0.0.0.0/0
                  key: LAB_ONLY_TACACS_SHARED_KEY_DO_NOT_REUSE
              ldap:
                enabled: true
                server_uri: ldaps://openldap:1636
                ca_path: /opt/docker/openldap/pki/ca.crt
                bind_dn: cn=tacacs,ou=services,dc=tmnt,dc=localhost
                bind_password: LAB_ONLY_TACACS_LDAP_BIND_PASSWORD_DO_NOT_REUSE
                user_base_dn: ou=people,dc=tmnt,dc=localhost
                group_base_dn: ou=groups,dc=tmnt,dc=localhost
                admin_group_cn: tacacs-admins
                network:
                  name: tmnt_openldap
                  external: true
          hosts:
            tacacs01:
        zabbix:
          vars:
            docker_zabbix:
              database:
                host: postgres
                port: "5432"
                name: zabbix
                user: zabbix
                password: LAB_ONLY_ZABBIX_POSTGRES_PASSWORD_DO_NOT_REUSE
                network:
                  name: tmnt_postgres
                  external: true
              ldap:
                enabled: true
                ca_path: /opt/docker/openldap/pki/ca.crt
                network:
                  name: tmnt_openldap
                  external: true
            ops_zabbix_ldap:
              enabled: false
              user_directory:
                host: ldaps://openldap
                port: 1636
                bind_dn: cn=zabbix,ou=services,dc=tmnt,dc=localhost
                bind_password: LAB_ONLY_ZABBIX_LDAP_BIND_PASSWORD_DO_NOT_REUSE
                base_dn: ou=people,dc=tmnt,dc=localhost
                group_basedn: ou=groups,dc=tmnt,dc=localhost
          hosts:
            zabbix01:
        zabbix_testhost:
          hosts:
            zabbix-testhost01:
        snmpv3_testhost:
          vars:
            docker_snmpv3_testhost:
              network:
                name: zabbix_zabbix
                external: true
          hosts:
            snmpv3-testhost01:
        network_device_emulator:
          vars:
            docker_network_device_emulator:
              network:
                name: zabbix_zabbix
                external: true
          hosts:
            network-device-emulator01:
