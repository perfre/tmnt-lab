all:
  vars:
    ansible_host: localhost
    ansible_connection: local
  children:
    docker_hosts:
      vars:
        service_docker:
          gpu:
            enabled: true
            vendor: nvidia
            mode: cdi
            verify: true
            device: nvidia.com/gpu=all
      hosts:
        docker-host01:
    docker:
      children:
        gitlab:
          hosts:
            gitlab01:
        ldap:
          hosts:
            ldap01:
        librenms:
          vars:
            docker_librenms:
              database:
                host: mariadb
                port: "3306"
                name: librenms
                user: librenms
                password: LAB_ONLY_LIBRENMS_MARIADB_PASSWORD_DO_NOT_REUSE
                network:
                  name: tmnt_mariadb
                  external: true
          hosts:
            librenms01:
        mariadb:
          vars:
            docker_mariadb:
              lab_mode: true
              bind_address: 127.0.0.1
              network:
                name: tmnt_mariadb
                alias: mariadb
            ops_mariadb:
              lab_mode: true
              databases:
                - name: librenms
                  encoding: utf8mb4
                  collation: utf8mb4_unicode_ci
                - name: powerdns
                  encoding: utf8mb4
                  collation: utf8mb4_unicode_ci
              users:
                - name: librenms
                  host: "%"
                  password: LAB_ONLY_LIBRENMS_MARIADB_PASSWORD_DO_NOT_REUSE
                  privileges:
                    "librenms.*": ALL
                - name: powerdns
                  host: "%"
                  password: LAB_ONLY_POWERDNS_MARIADB_PASSWORD_DO_NOT_REUSE
                  privileges:
                    "powerdns.*": SELECT,INSERT,UPDATE,DELETE
                - name: poweradmin
                  host: "%"
                  password: LAB_ONLY_POWERADMIN_MARIADB_PASSWORD_DO_NOT_REUSE
                  privileges:
                    "powerdns.*": ALL
          hosts:
            mariadb01:
        minio:
          hosts:
            minio01:
        netbox:
          vars:
            docker_netbox:
              database:
                host: postgres
                port: "5432"
                name: netbox
                user: netbox
                password: LAB_ONLY_NETBOX_POSTGRES_PASSWORD_DO_NOT_REUSE
                network:
                  name: tmnt_postgres
                  external: true
          hosts:
            netbox01:
        nomad:
          children:
            nomad_server:
              hosts:
                nomad-srv01:
                nomad-srv02:
                nomad-srv03:
            nomad_client:
              hosts:
                nomad-client01:
                nomad-client02:
        openbao:
          hosts:
            openbao01:
        ollama_server:
          vars:
            docker_ollama_server:
              lab_mode: true
              api:
                publish: true
                bind_address: 127.0.0.1
                port: 11434
              gpu:
                enabled: true
                devices:
                  - nvidia.com/gpu=all
            ops_ollama_models:
              lab_mode: true
              models:
                - name: qwen3:8b
                  type: llm
                  state: present
                  warm: true
                  license: Apache-2.0
                  source_url: https://ollama.com/library/qwen3:8b
                - name: bge-m3:latest
                  type: embedding
                  state: present
                  warm: true
                  license: MIT
                  source_url: https://ollama.com/library/bge-m3
              warm_api:
                enabled: true
                scheme: http
                host: 127.0.0.1
                port: 11434
                validate_certs: false
                keep_alive: -1
          hosts:
            ollama-server01:
        atlassian_lab:
          vars:
            docker_atlassian_lab:
              database:
                network:
                  name: tmnt_postgres
                  external: true
                jira:
                  host: postgres
                  port: "5432"
                  name: jira
                  user: jira
                  password: LAB_ONLY_JIRA_DB_PASSWORD_DO_NOT_REUSE
                confluence:
                  host: postgres
                  port: "5432"
                  name: confluence
                  user: confluence
                  password: LAB_ONLY_CONFLUENCE_DB_PASSWORD_DO_NOT_REUSE
          hosts:
            atlassian-lab01:
        postgres:
          vars:
            docker_postgres:
              lab_mode: true
              bind_address: 127.0.0.1
              network:
                name: tmnt_postgres
                alias: postgres
            # Canonical lab bootstrap manifest. Add every new PostgreSQL-backed
            # system's user and database here in the same change as its role.
            ops_postgres:
              lab_mode: true
              users:
                - name: jira
                  password: LAB_ONLY_JIRA_DB_PASSWORD_DO_NOT_REUSE
                - name: confluence
                  password: LAB_ONLY_CONFLUENCE_DB_PASSWORD_DO_NOT_REUSE
                - name: netbox
                  password: LAB_ONLY_NETBOX_POSTGRES_PASSWORD_DO_NOT_REUSE
                - name: zabbix
                  password: LAB_ONLY_ZABBIX_POSTGRES_PASSWORD_DO_NOT_REUSE
              databases:
                - name: jira
                  owner: jira
                - name: confluence
                  owner: confluence
                - name: netbox
                  owner: netbox
                - name: zabbix
                  owner: zabbix
          hosts:
            postgres01:
        powerdns:
          vars:
            docker_powerdns:
              lab_mode: true
              bind_address: 127.0.0.1
              database:
                host: mariadb
                port: "3306"
                name: powerdns
                user: powerdns
                password: LAB_ONLY_POWERDNS_MARIADB_PASSWORD_DO_NOT_REUSE
                network:
                  name: tmnt_mariadb
                  external: true
              api:
                key: LAB_ONLY_POWERDNS_API_KEY_DO_NOT_REUSE
            docker_powerdns_recursor:
              lab_mode: true
              bind_address: 127.0.0.1
            docker_poweradmin:
              lab_mode: true
              bind_address: 127.0.0.1
              web:
                publish: true
                hostname: poweradmin.localhost
                https_port: 8445
              database:
                host: mariadb
                port: "3306"
                name: powerdns
                user: poweradmin
                password: LAB_ONLY_POWERADMIN_MARIADB_PASSWORD_DO_NOT_REUSE
                network:
                  name: tmnt_mariadb
                  external: true
              powerdns_api:
                url: http://powerdns:8081
                key: LAB_ONLY_POWERDNS_API_KEY_DO_NOT_REUSE
                network:
                  name: tmnt_powerdns_api
                  external: true
              admin:
                password: LAB_ONLY_POWERADMIN_ADMIN_PASSWORD_DO_NOT_REUSE
              session_key: LAB_ONLY_POWERADMIN_SESSION_KEY_DO_NOT_REUSE_0123456789abcdef
          hosts:
            powerdns01:
        radius:
          hosts:
            radius01:
        tacacs:
          hosts:
            tacacs01:
        zabbix:
          vars:
            docker_zabbix:
              database:
                host: postgres
                port: "5432"
                name: zabbix
                user: zabbix
                password: LAB_ONLY_ZABBIX_POSTGRES_PASSWORD_DO_NOT_REUSE
                network:
                  name: tmnt_postgres
                  external: true
          hosts:
            zabbix01:
        zabbix_testhost:
          hosts:
            zabbix-testhost01:
        snmpv3_testhost:
          vars:
            docker_snmpv3_testhost:
              network:
                name: zabbix_zabbix
                external: true
          hosts:
            snmpv3-testhost01:
        network_device_emulator:
          vars:
            docker_network_device_emulator:
              network:
                name: zabbix_zabbix
                external: true
          hosts:
            network-device-emulator01:
