# Deployment pipeline

- name: Prepare Docker hosts
  hosts: docker_hosts
  become: true
  gather_facts: true
  roles:
    - role: service_docker
      tags: [service_docker]

- name: Deploy OpenBao
  hosts: openbao
  become: true
  gather_facts: true
  roles:
    - role: docker_openbao
      tags: [docker_openbao]
    - role: ops_openbao_ldap
      tags: [ops_openbao_ldap]

- name: Deploy MariaDB stack
  hosts: mariadb
  become: true
  gather_facts: true
  roles:
    - role: docker_mariadb
      tags: [docker_mariadb]
    - role: ops_mariadb
      tags: [ops_mariadb]

- name: Deploy PostgreSQL stack
  hosts: postgres
  become: true
  gather_facts: true
  roles:
