# Deployment pipeline

- hosts: docker_hosts
  become: true
  gather_facts: true
  roles:
    - role: service_docker
      tags: [service_docker]

- hosts: openbao
  become: true
  gather_facts: true
  roles:
    - role: docker_openbao
      tags: [docker_openbao]

- hosts: mariadb
  become: true
  gather_facts: true
  roles:
    - role: docker_mariadb
      tags: [docker_mariadb]
    - role: ops_mariadb
      tags: [ops_mariadb]

- hosts: postgres
  become: true
  gather_facts: true
  roles:
    - role: docker_postgres
      tags: [docker_postgres]
    - role: ops_postgres
      tags: [ops_postgres]

- hosts: ollama_server
  become: true
  gather_facts: true
  roles:
    - role: docker_ollama_server
      tags: [docker_ollama_server]
    - role: ops_ollama_models
      tags: [ops_ollama_models]

- hosts: atlassian_lab
  become: true
  gather_facts: true
  roles:
    - role: docker_atlassian_lab
      tags: [docker_atlassian_lab]

- hosts: zabbix
  become: true
  gather_facts: true
  roles:
    - role: docker_zabbix
      tags: [docker_zabbix]

- hosts: librenms
  become: true
  gather_facts: true
  roles:
    - role: docker_librenms
      tags: [docker_librenms]

- name: Deploy PowerDNS lab stack
  hosts: powerdns
  become: true
  gather_facts: true
  roles:
    - role: docker_powerdns
      tags: [docker_powerdns]
    - role: docker_powerdns_recursor
      tags: [docker_powerdns_recursor]
    - role: docker_poweradmin
      tags: [docker_poweradmin]

- hosts: netbox
  become: true
  gather_facts: true
  roles:
    - role: docker_netbox
      tags: [docker_netbox]

- hosts: zabbix_testhost
  become: true
  gather_facts: true
  roles:
    - role: docker_zabbix_testhost
      tags: [docker_zabbix_testhost]

- hosts: snmpv3_testhost
  become: true
  gather_facts: true
  roles:
    - role: docker_snmpv3_testhost
      tags: [docker_snmpv3_testhost]

- hosts: network_device_emulator
  become: true
  gather_facts: true
  roles:
    - role: docker_network_device_emulator
      tags: [docker_network_device_emulator]
